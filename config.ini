# ============================================================
# config.ini —— 项目总配置文件
# 被 base/config.py 读取，改这里 = 全项目生效
# 语法说明：
#   [节名]      节（section）
#   key = value 键值对
#   # 开头是整行注释（本文件不要写"行尾注释"，configparser 会把它当值的一部分）
# ============================================================

# MySQL 配置（FAQ 题库 + 会话历史）
[mysql]
host = localhost
user = root
password = 123456
database = subjects_kg

# Redis 配置（缓存题库和答案，加速 FAQ）
[redis]
host = localhost
port = 6379
# password = 1234
db = 0

# 日志配置
[logger]
log_file = logs/app.log

# Milvus 向量库配置（RAG 检索）
# uri 为 Milvus 独立版默认地址；如果用 milvus-lite，可改成如 ./milvus.db
[milvus]
uri=http://localhost:19530
database_name = itcast
collection_name = edurag

# 大模型配置（DeepSeek OpenAI 兼容接口）
[llm]
model = deepseek-v4-flash
llm_api_key = your-deepseek-api-key
llm_base_url = https://api.deepseek.com

# 检索参数配置
# parent_chunk_size 父块大小（喂给大模型的长上下文）
# child_chunk_size  子块大小（用于向量检索的精准小块）
# chunk_overlap     相邻块重叠字数（防止知识点被切在边界丢失）
# retrieval_k       每路（稠密/稀疏）初步召回数量
# candidate_m       重排序后最终保留的块数
[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 3
candidate_m = 2

# 应用配置
# valid_sources 前端"学科过滤"下拉框选项，需与 data 目录下 xxx_data 对应
[app]
valid_sources = ["ai", "java", "test", "ops", "bigdata"]
customer_service_phone = 13800138001
